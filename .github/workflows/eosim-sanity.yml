name: EoSim Sanity

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  # Pin the newest EoSim tag. v3.0.2 is self-consistent: tag name ==
  # pyproject version == eosim.__version__ (3.0.2). The v3.0.1 tag
  # shipped a stale __version__ (2.0.0), which broke this gate until
  # the pin moved (embeddedos-org/EoSim#36).
  EOSIM_VERSION: "3.0.2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-validate:
    name: Install & Validate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Every step here is written in bash: `$(...)`, `|| { ... }`, a heredoc,
    # and /tmp. Without this the Windows legs ran them under PowerShell, where
    # `SITE_PACKAGES=$(...)` is an unknown command and the job went red, while
    # the `|| { exit 1 }` guard in "Verify installation" parsed as an unexecuted
    # script block and could never fail.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install EoSim
        uses: embeddedos-org/.github/.github/actions/install-eosim@master
        with:
          version: ${{ env.EOSIM_VERSION }}
      - name: Verify installation
        run: |
          # Assert the installed package version matches the pinned tag.
          # The expected version is derived from EOSIM_VERSION so the
          # assertion cannot drift from the pin again.
          eosim --version
          PATTERN=$(printf '%s' "${{ env.EOSIM_VERSION }}" | sed 's/\./\\./g')
          eosim --version | grep -qE "$PATTERN" || {
            echo "::error::eosim --version is not the expected ${{ env.EOSIM_VERSION }} for tag v${{ env.EOSIM_VERSION }}"
            eosim --version
            exit 1
          }
      # v3.0.2+ ships the full platforms tree inside the package
      # (eosim/platforms/, 150+ targets), so `pip install` already places
      # it at <site-packages>/eosim/platforms -- no copy step needed.
      # (The stale top-level-platforms copy was removed here.)
      - name: Validate all platform configs
        run: |
          eosim doctor
          # Assert a non-zero count rather than trusting the exit code:
          # `eosim list` exits 0 with zero platforms, which is how this step
          # passed while checking nothing.
          python - <<'PY'
          import os, sys
          from eosim.platforms import discover_platforms
          import eosim, pathlib
          root = pathlib.Path(eosim.__file__).parent / "platforms"
          found = discover_platforms(str(root))
          print(f"discovered {len(found)} platforms under {root}")
          if not found:
              sys.exit("::error::no platform configs discovered; "
                       "this step would otherwise pass having validated nothing")
          PY

  nested-simulation:
    name: Nested Simulation (${{ matrix.platform }})
    needs: install-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - arm64-linux
          - riscv64-linux
          - stm32f4
          - raspi4
          - esp32
          - nrf52
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EoSim
        uses: embeddedos-org/.github/.github/actions/install-eosim@master
        with:
          version: ${{ env.EOSIM_VERSION }}
      - name: Simulate ${{ matrix.platform }}
        # Two honest contracts, by engine (EoSim 4db3434a fixed #38):
        # - native engine: `eosim run` without --firmware exits 2 with
        #   "NO FIRMWARE" (it no longer fakes a pass over zeroed memory).
        # - qemu engine: qemu not installed -> "QEMU NOT INSTALLED", exit 2
        #   (reported as SKIP; installing qemu in CI is tracked separately);
        #   qemu installed -> the command actually executes and its exit code
        #   propagates. The engine never reports PASSED without execution.
        # Real firmware execution needs a built image (eBoot#147).
        shell: bash
        run: |
          set +e
          out=$(eosim run ${{ matrix.platform }} --headless --timeout 10 2>&1)
          code=$?
          set -e
          echo "$out"
          if echo "$out" | grep -q "via qemu"; then
            if echo "$out" | grep -q "QEMU NOT INSTALLED"; then
              [ "$code" -eq 2 ] || { echo "::error::expected exit 2, got $code"; exit 1; }
              echo "${{ matrix.platform }}: SKIP (qemu not installed)"
            else
              [ "$code" -eq 0 ] || { echo "::error::qemu executed but failed, exit $code"; exit 1; }
              echo "$out" | grep -q "PASSED" || { echo "::error::expected the PASSED contract message"; exit 1; }
              echo "${{ matrix.platform }}: PASSED (qemu executed)"
            fi
          else
            echo "$out" | grep -q "NO FIRMWARE" || { echo "::error::expected the NO FIRMWARE contract message"; exit 1; }
            [ "$code" -eq 2 ] || { echo "::error::expected exit 2, got $code"; exit 1; }
            echo "${{ matrix.platform }}: PASSED (no-firmware contract)"
          fi

  # eBoot#147: the gate above proves the install, platform discovery, and
  # the honest no-firmware failure -- but executes zero firmware. This job
  # builds a minimal ARM32 smoke image from tools/eosim-smoke/ and runs it
  # through the native engine on stm32f4 (flash base 0x08000000, which is
  # where the engine loads --firmware images). A full eBoot stage0 does
  # hardware init the engine does not model, so the smoke image is the
  # honest minimum: 4 instructions the decoder supports (3x MOV, UDF halt).
  # Success is the engine's clean-halt contract: exit 0, PASSED, cycles > 0.
  real-firmware:
    name: Real Firmware (stm32f4, native engine)
    needs: install-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EoSim
        uses: embeddedos-org/.github/.github/actions/install-eosim@master
        with:
          version: ${{ env.EOSIM_VERSION }}
      - name: Install ARM toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Build smoke firmware
        run: |
          arm-none-eabi-as tools/eosim-smoke/smoke.s -o /tmp/smoke.o
          arm-none-eabi-objcopy -O binary /tmp/smoke.o /tmp/smoke.bin
          ls -l /tmp/smoke.bin
          # 4 ARM32 words; anything else means the source drifted from the
          # contract the assertions below check.
          [ "$(stat -c%s /tmp/smoke.bin)" -eq 16 ] || { echo "::error::smoke.bin is not 16 bytes"; exit 1; }
      - name: Execute real firmware
        run: |
          set +e
          out=$(eosim run stm32f4 --firmware /tmp/smoke.bin --headless --timeout 60 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 0 ] || { echo "::error::expected exit 0, got $code"; exit 1; }
          echo "$out" | grep -q "PASSED" || { echo "::error::expected the PASSED contract message"; exit 1; }
          cycles=$(echo "$out" | sed -n 's/.*PASSED (\([0-9][0-9]*\) cycles.*/\1/p')
          [ -n "$cycles" ] && [ "$cycles" -gt 0 ] || { echo "::error::expected cycles > 0, got '$cycles'"; exit 1; }
          echo "stm32f4: real firmware executed ($cycles cycles)"

  nested-guest-install:
    name: Guest OS Install (${{ matrix.guest }})
    needs: install-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - guest: Linux x86_64
            platform: x86_64-linux
          - guest: Linux aarch64
            platform: arm64-linux
          - guest: Linux riscv64
            platform: riscv64-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EoSim
        uses: embeddedos-org/.github/.github/actions/install-eosim@master
        with:
          version: ${{ env.EOSIM_VERSION }}
      - name: Boot guest and test EoSim inside
        # Same engine contracts as nested-simulation (see above).
        # The x86_64 guest is a qemu-engine platform: assert the
        # documented dry-run message (EoSim#38), not the NO FIRMWARE path.
        shell: bash
        run: |
          echo "=== Nested Guest: ${{ matrix.guest }} ==="
          set +e
          out=$(eosim run ${{ matrix.platform }} --headless --timeout 15 2>&1)
          code=$?
          set -e
          echo "$out"
          if echo "$out" | grep -q "via qemu"; then
            echo "$out" | grep -q "PASSED (dry run)" || { echo "::error::expected the qemu dry-run message (EoSim#38)"; exit 1; }
            [ "$code" -eq 0 ] || { echo "::error::expected exit 0, got $code"; exit 1; }
            echo "${{ matrix.guest }}: PASSED (qemu dry-run; see EoSim#38)"
          else
            echo "$out" | grep -q "NO FIRMWARE" || { echo "::error::expected the NO FIRMWARE contract message"; exit 1; }
            [ "$code" -eq 2 ] || { echo "::error::expected exit 2, got $code"; exit 1; }
            echo "${{ matrix.guest }}: PASSED (no-firmware contract)"
          fi

  windows-sanity:
    name: Windows Sanity
    needs: install-validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `eosim list` exits 0 with zero platforms, so "list && doctor" passed
      # on both these runners while validating nothing. Assert a non-zero
      # platform count from the in-package tree, as install-validate does.
      - name: Install EoSim
        uses: embeddedos-org/.github/.github/actions/install-eosim@master
        with:
          version: ${{ env.EOSIM_VERSION }}
      - name: Test EoSim on Windows
        shell: bash
        run: |
          eosim --version
          eosim doctor
          python -c "
          import pathlib, sys, eosim
          from eosim.platforms import discover_platforms
          root = pathlib.Path(eosim.__file__).parent / 'platforms'
          found = discover_platforms(str(root))
          print(f'discovered {len(found)} platforms')
          sys.exit(0 if found else 'no platform configs discovered')
          "

  macos-sanity:
    name: macOS Sanity
    needs: install-validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EoSim
        uses: embeddedos-org/.github/.github/actions/install-eosim@master
        with:
          version: ${{ env.EOSIM_VERSION }}
      - name: Test EoSim on macOS
        shell: bash
        run: |
          eosim --version
          eosim doctor
          python -c "
          import pathlib, sys, eosim
          from eosim.platforms import discover_platforms
          root = pathlib.Path(eosim.__file__).parent / 'platforms'
          found = discover_platforms(str(root))
          print(f'discovered {len(found)} platforms')
          sys.exit(0 if found else 'no platform configs discovered')
          "

  sanity-gate:
    name: EoSim Sanity Gate
    if: always()
    needs: [install-validate, nested-simulation, real-firmware, nested-guest-install, windows-sanity, macos-sanity]
    runs-on: ubuntu-latest
    steps:
      # Iterates toJSON(needs) rather than naming one dependency. The
      # previous body tested install-validate alone and then printed "All
      # EoSim sanity checks passed" -- which it would do with the other four
      # jobs red. This workflow has never had a green run, so this gate is
      # about to start mattering for the first time; a summary that asserts
      # more than it checked is the wrong thing to start with.
      - name: Every job in this workflow must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS"
          bad=$(printf '%s' "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success")
            | "  \(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::EoSim Sanity Gate failed. These jobs did not succeed:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All EoSim sanity jobs succeeded."

