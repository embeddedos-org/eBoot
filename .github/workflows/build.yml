name: eBoot Build & Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-host:
    name: Host Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc g++

      - name: Configure (host, tests enabled)
        run: cmake -B build -DEBLDR_BUILD_TESTS=ON -DEBLDR_BOARD=none

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

  build-arm:
    name: Cross-compile STM32F4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Configure
        run: |
          # A production key, not the dev-key opt-out. With the trust-anchor gate
          # in place, every other pre-merge job that configures a real board
          # passes -DEBLDR_ALLOW_DEV_KEY=ON, so the branch a real device takes --
          # build/generated/production_key.c and the #ifdef EBLDR_PRODUCTION_KEY
          # half of core/keystore.c -- was first cross-compiled inside release.yml,
          # when a tag was pushed. A link or section-placement fault in the
          # generated TU would have surfaced during a release, not a review.
          # The key is RFC 8032 section 7.1 TEST 2's public key: a genuine curve
          # point (the configure-time check runs on it), the same fixture the host
          # tests use, and one whose secret is published -- this job's output
          # reaches no device. ci.yml's ARM leg still compiles the dev-key branch.
          cmake -B build-arm \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_C_COMPILER=arm-none-eabi-gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DEBLDR_BOARD=stm32f4 \
            -DEBLDR_PRODUCTION_KEY=3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c \
            -DCMAKE_C_FLAGS="-mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 -specs=nosys.specs"

      - name: Build
        run: cmake --build build-arm --parallel
      - name: The production-key branch was compiled, not the dev key
        run: |
          test -f build-arm/generated/production_key.c
          # CMake names objects .obj, not .o, when CMAKE_SYSTEM_NAME=Generic;
          # the first run of this step looked for .o and reported the TU
          # uncompiled when the build log showed it compiling. Match both.
          obj=$(find build-arm \( -name 'production_key.c.o' -o -name 'production_key.c.obj' \) | head -1)
          test -n "$obj" || { echo '::error::generated/production_key.c was not compiled'; exit 1; }
          # the object must carry the fixture key and must not carry the dev key
          python3 - "$obj" <<'PY'
          import sys
          o = open(sys.argv[1], 'rb').read()
          fixture = bytes.fromhex('3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c')
          dev = bytes.fromhex('d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a')
          assert fixture in o, 'the configured production key is not in the object'
          assert dev not in o, 'the development key is in the production-key object'
          print('production_key.c.o carries the fixture key and not the dev key')
          PY

      - name: Report size
        run: arm-none-eabi-size build-arm/*.elf 2>/dev/null || true

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --error-exitcode=1 \
            core/ hal/ 2>&1 || true

  build-r5:
    name: Cross-assemble Cortex-R5 stage-0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Assemble and link the R5 stage-0
        run: |
          # Regression guard for #137: r5_stage0_startup.S is the only emitter
          # of the Cortex-R .vectors section (eight branch instructions).
          # Before it existed, --gc-sections discarded stage-0 and the R5
          # image linked to 0 bytes -- and no CI job ever assembled this file,
          # so the defect was invisible. The two stage-0 entry points are
          # stubbed here: this job verifies the startup code assembles, links
          # against cortex_r5_stage0.ld, and keeps its vector table; the full
          # stage-0 C build is the board build's job, not this smoke leg's.
          cat > r5_stubs.c <<'STUB'
          void ebldr_hw_init_minimal(void) {}
          void ebldr_stage0_main(void) {}
          STUB
          arm-none-eabi-gcc -mcpu=cortex-r5 -marm -c boards/cortex_r5/r5_stage0_startup.S -o r5_stage0.o
          arm-none-eabi-gcc -mcpu=cortex-r5 -marm -c r5_stubs.c -o r5_stubs.o
          arm-none-eabi-gcc -mcpu=cortex-r5 -marm -nostdlib -T boards/cortex_r5/cortex_r5_stage0.ld -Wl,--gc-sections r5_stage0.o r5_stubs.o -o r5_stage0.elf

      - name: The vector table survived the link (the #137 assertion)
        run: |
          arm-none-eabi-readelf -S r5_stage0.elf | tee sections.txt
          python3 - <<'PY'
          import re
          txt = open('sections.txt').read()
          m = re.search(r'\.vectors\s+PROGBITS\s+([0-9a-f]+)\s+[0-9a-f]+\s+([0-9a-f]+)', txt)
          assert m, '.vectors section missing from the linked image'
          addr, size = int(m.group(1), 16), int(m.group(2), 16)
          assert addr == 0, f'.vectors at {addr:#x}, expected 0x0 (reset fetches there)'
          assert size == 32, f'.vectors is {size} bytes, expected 32 (eight branch instructions)'
          print('.vectors: 32 bytes at 0x0')
          PY
          arm-none-eabi-objcopy -O binary r5_stage0.elf r5_stage0.bin
          test -s r5_stage0.bin || { echo '::error::r5_stage0.bin is empty -- the #137 defect is back'; exit 1; }
          arm-none-eabi-size r5_stage0.elf
